[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "qgent-cli"
version = "0.2.0"
description = "QGent CLI - a QGIS-focused AI agent for the terminal, powered by your Claude Code or Codex CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ljdstechva" }]
keywords = ["qgis", "gis", "pyqgis", "ai-agent", "mcp", "cli", "claude", "codex"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "rich>=13.7",
  "prompt_toolkit>=3.0.43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
qgent = "qgent_cli.cli:main"

[project.urls]
Homepage = "https://github.com/ljdstechva/qgent-cli"
"QGIS plugin" = "https://github.com/ljdstechva/qgent"

[tool.hatch.build.targets.wheel]
packages = ["src/qgent_cli"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored verbatim from the QGIS plugin (scripts/sync_from_plugin.py).
extend-exclude = ["src/qgent_cli/engine/layout_tools.py", "src/qgent_cli/engine/vicinity_text.py", "src/qgent_cli/safety.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105"]

[tool.ruff.lint.per-file-ignores]
# Runs under QGIS's own (possibly older) Python: keep 3.9-compatible idioms.
"src/qgent_cli/engine/*" = ["UP017", "UP006", "UP035"]
